[workspace]
resolver = "2"
members = ["crates/lvt-core", "crates/lvt-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
lvt-core = { path = "crates/lvt-core" }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
encoding_rs = "0.8.35"
chardetng = "1.0.0"
regex = "1.11"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
